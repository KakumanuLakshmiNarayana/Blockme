<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, sans-serif; width: 280px; padding: 16px; background: #0a0a0a; color: #e5e5e5; margin: 0; }
    h1 { font-size: 16px; color: #ef4444; margin: 0 0 4px; }
    p  { font-size: 11px; color: #6b7280; margin: 0 0 12px; }
    .stat { background: #1f1f1f; border-radius: 8px; padding: 10px 12px; margin: 6px 0; font-size: 12px; }
    .stat span { color: #9ca3af; }
    .stat strong { color: #fff; float: right; }
    a { color: #ef4444; font-size: 11px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Blockme</h1>
  <p>URL-pattern blocking companion</p>
  <div class="stat"><span>Active URL rules</span><strong id="rules">...</strong></div>
  <div class="stat"><span>Last synced</span><strong id="sync">...</strong></div>
  <br>
  <a href="http://localhost:3000" target="_blank">Open Dashboard →</a>
  <script src="popup.js"></script>
</body>
</html>
